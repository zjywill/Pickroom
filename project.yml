name: Pickroom
options:
  bundleIdPrefix: com.junyizhang
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
packages:
  RawEngine:
    path: Packages/RawEngine
targets:
  Pickroom:
    type: application
    platform: macOS
    sources:
      - path: Pickroom
      # Bundled so the acknowledgements window can show the licence texts on a
      # Mac that only ever saw the DMG. Referenced where they live rather than
      # copied, so there is one copy to keep correct.
      - path: Packages/RawEngine/ThirdPartyLicenses
        buildPhase: resources
    dependencies:
      - package: RawEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junyizhang.Pickroom
        PRODUCT_NAME: Pickroom
        CODE_SIGN_ENTITLEMENTS: Pickroom/Pickroom.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pickroom
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Junyi Zhang. All rights reserved.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Pickroom reads your photo library so you can cull and filter photos in place. iCloud originals are downloaded only when you explicitly ask for one.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: YES
        SWIFT_STRICT_CONCURRENCY: targeted
  PickroomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PickroomTests
    dependencies:
      - target: Pickroom
      - package: RawEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junyizhang.PickroomTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pickroom:
    build:
      targets:
        Pickroom: all
        PickroomTests: [test]
    test:
      targets:
        - PickroomTests
